name: Check sources

# Every Monday, verify that every source link on Dorothy still works.
# If one breaks, an issue is opened so a volunteer can re-verify it.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 3 --timeout 30 --accept 200,203,206,301,302,403,429 "src/pages/*.html" "src/data/*.js"
          fail: false
      - name: Open an issue if any link is broken
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Source check: some links need re-verification"
          content-filepath: ./lychee/out.md
          labels: verification
