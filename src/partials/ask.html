<div class="ask-shell" data-ask {{deeplink}}>
  <div class="ask-head">
    <div class="ask-id">
      <svg class="avatar" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#e1251b"/><g fill="none" stroke="#fff" stroke-width="1.6"><circle cx="20" cy="14.4" r="4.4"/><circle cx="25.6" cy="20" r="4.4"/><circle cx="20" cy="25.6" r="4.4"/><circle cx="14.4" cy="20" r="4.4"/></g><circle cx="20" cy="20" r="1.6" fill="#fff"/></svg>
      <div><strong>Ask Dorothy</strong><small>A little guidance, whenever you need it. <span class="ta" lang="ta">தமிழிலும் கேட்கலாம்.</span></small></div>
    </div>
    <div class="lang-toggle" role="group" aria-label="Answer language">
      <button type="button" data-lang="en" aria-pressed="true">English</button>
      <button type="button" data-lang="ta" aria-pressed="false" class="ta">தமிழ்</button>
    </div>
  </div>
  <div class="chips">
    <button type="button" class="chip" data-ask-q data-q-en="So, who's behind Dorothy?" data-q-ta="டோரதியை யார் நடத்துகிறார்கள்?">So, who's behind Dorothy?</button>
    <button type="button" class="chip" data-ask-q data-q-en="What's in your list?" data-q-ta="உங்களால் என்ன செய்ய முடியும்?">What's in your list?</button>
    <button type="button" class="chip" data-ask-q data-q-en="How do I get a transgender ID card?" data-q-ta="திருநர் அடையாள அட்டை எப்படி பெறுவது?">How do I get a transgender ID card?</button>
    <button type="button" class="chip" data-ask-q data-q-en="I need a safe place to stay" data-q-ta="எனக்கு தங்க இடம் வேண்டும்">I need a safe place to stay</button>
    <button type="button" class="chip" data-ask-q data-q-en="How can I reach you?" data-q-ta="உங்களை எப்படித் தொடர்பு கொள்வது?">How can I reach you?</button>
  </div>
  <div class="log" aria-live="polite"></div>
  <form class="ask-form" autocomplete="off">
    <label for="ask-input-{{id}}">What can I help you with today?</label>
    <input id="ask-input-{{id}}" name="q" type="text" maxlength="300" placeholder="Ask a question…">
    <button class="btn btn--light" type="submit">Send <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 11 11 5M6 5h5v5"/></svg></button>
  </form>
  <p class="ask-note">Answers come only from verified sources and are never stored. Dorothy AI is not a doctor, lawyer or therapist. In danger? Call <a href="tel:112" style="text-decoration:underline">112</a>.</p>
</div>
